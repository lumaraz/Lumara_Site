<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestão — Lumara Silva</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/svg+xml" href="../img/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32.png">
<link rel="apple-touch-icon" href="../img/favicon-180.png">
<link rel="preload" href="../fonts/inter-tight-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../css/fontes.css">
<style>
:root{
  --papel:#F2EFE9;--sup:#FBFAF7;--branco:#FFFFFF;--tinta:#2D2D2D;--mar:#3A6EA5;--ipe:#86BBD8;--mata:#2F6B4F;--ocre:#23446A;--azul-prof:#23446A;
  --nevoa:#E2DDD4;--linha:#D3CCC1;--cinza:#6B6560;--alerta:#A3283A;
  --f:"Inter Tight",system-ui,sans-serif;--titulo:"Inter Tight",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--papel);color:var(--tinta);font-family:var(--f);font-size:.97rem;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--mar);outline-offset:2px;border-radius:3px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}

/* lateral */
.lateral{background:var(--tinta);color:var(--papel);padding:1.25rem .9rem;display:flex;flex-direction:column;gap:1.25rem}
@media (min-width:861px){
  html,body{height:100%;overflow:hidden}
  body{display:flex;flex-direction:column}
  .app{flex:1;min-height:0;grid-template-rows:100%}
  .lateral{height:100%;overflow-y:auto}
  main{height:100%;overflow-y:auto}
}
.logo{padding:0 .5rem;line-height:1}
.logo img{height:30px;width:auto;display:block}
.logo small{display:block;font-family:var(--f);font-size:.8rem;opacity:.65;margin-top:.3rem}
.menu{list-style:none;display:flex;flex-direction:column;gap:2px}
.menu a{display:flex;justify-content:space-between;align-items:center;padding:.55rem .6rem;border-radius:6px;text-decoration:none;color:rgba(237,239,234,.82)}
.menu a:hover{background:rgba(237,239,234,.08);color:var(--papel)}
.menu a[aria-current=page]{background:var(--papel);color:var(--tinta);font-weight:600}
.menu .cont{background:var(--ipe);color:var(--tinta);font-size:.75rem;font-weight:700;border-radius:99px;padding:0 .45rem;min-width:1.3rem;text-align:center}
.vercomo{margin-top:auto;font-size:.82rem;padding:0 .4rem}
.vercomo label{display:block;opacity:.7;margin-bottom:.3rem}
.vercomo select{width:100%;background:rgba(237,239,234,.1);border:1px solid rgba(237,239,234,.25);color:var(--papel);border-radius:6px;padding:.4rem}
.vercomo select option{color:var(--tinta)}
.vercomo button{white-space:nowrap;margin-top:.7rem;background:none;border:1px solid rgba(237,239,234,.4);color:var(--papel);border-radius:99px;cursor:pointer;font-size:.8rem;font-weight:600;padding:.35rem .9rem}
.vercomo button:hover{background:rgba(237,239,234,.12)}
.site-link{display:inline-flex;align-self:flex-start;margin-left:.4rem;font-size:.85rem;font-weight:600;color:var(--papel);text-decoration:none;border:1px solid rgba(237,239,234,.4);border-radius:99px;padding:.35rem .9rem}
.site-link:hover{background:rgba(237,239,234,.12)}

/* topo mobile */
.topo-m{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .lateral{position:fixed;inset:0 25% 0 0;z-index:40;transform:translateX(-100%);visibility:hidden;transition:transform .2s,visibility 0s .2s}
  .lateral.aberta{transform:none;visibility:visible;transition:transform .2s;box-shadow:0 0 0 100vmax rgba(22,32,43,.4)}
  .topo-m{display:flex;align-items:center;justify-content:space-between;padding:.7rem 1rem;background:var(--tinta);color:var(--papel);position:sticky;top:0;z-index:30}
  .topo-m button{background:none;border:1px solid rgba(237,239,234,.4);color:var(--papel);border-radius:99px;padding:.35rem .9rem;cursor:pointer;font-weight:600}
}

/* conteúdo */
main{padding:clamp(1.25rem,3vw,2.25rem) clamp(1.25rem,3vw,2.25rem) calc(clamp(1.25rem,3vw,2.25rem) + 52px);min-width:0}
main:focus{outline:none}
.cab{display:flex;justify-content:space-between;align-items:end;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem}
h1{font-family:var(--titulo);font-size:clamp(1.9rem,3.4vw,2.6rem);font-weight:700;letter-spacing:-.04em;line-height:1}
.cab p{color:var(--cinza);margin-top:.35rem}
h2{font-size:1.15rem;font-weight:700;letter-spacing:-.01em;margin-bottom:.75rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;text-decoration:none;line-height:1.2;border:1px solid var(--mar);background:var(--mar);color:#fff;padding:.55rem 1rem;border-radius:99px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:#2C5682;border-color:#2C5682}
.btn.sec{background:transparent;color:var(--tinta)}
.btn.sec:hover{background:var(--tinta);color:var(--papel)}
.btn.peq{padding:.3rem .75rem;font-size:.87rem}
.btn.perigo{background:transparent;color:var(--alerta);border-color:var(--alerta)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.acoes{display:flex;gap:.5rem;flex-wrap:wrap}
.painel{background:var(--sup);border:1px solid var(--nevoa);border-radius:8px;padding:1.1rem 1.2rem}
.vazio{color:var(--cinza);padding:1rem 0}

/* números */
.numeros{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--nevoa);border:1px solid var(--nevoa);border-radius:8px;overflow:hidden;margin-bottom:1.5rem}
.num{background:var(--sup);padding:1rem 1.1rem}
.num dt{font-size:.85rem;color:var(--cinza)}
.num dd{font-size:1.55rem;font-weight:700;letter-spacing:-.02em;margin-top:.15rem;font-variant-numeric:tabular-nums}
.num dd.pos{color:var(--mata)} .num dd.neg{color:var(--alerta)}
.num .obs{font-size:.8rem;color:var(--cinza);margin-top:.1rem}

.grade2{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem}
@media (max-width:1000px){.grade2{grid-template-columns:1fr}}

/* listas e tabelas */
.tabela{width:100%;border-collapse:collapse;background:var(--sup);border:1px solid var(--nevoa);border-radius:8px;overflow:hidden}
.tabela th{text-align:left;font-weight:600;font-size:.83rem;color:var(--cinza);padding:.6rem .8rem;border-bottom:1px solid var(--linha);background:var(--papel)}
.tabela td{padding:.7rem .8rem;border-bottom:1px solid var(--nevoa);vertical-align:middle}
.tabela tr:last-child td{border-bottom:0}
.tabela tr.clicavel{cursor:pointer}
.tabela tr.clicavel:hover td{background:#fff}
.linha-btn{background:none;border:0;padding:0;font-weight:600;cursor:pointer;text-align:left}
.linha-btn:hover{text-decoration:underline;text-underline-offset:3px}
.tabela .valor{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tab-wrap{overflow-x:auto}
.item-lista{display:flex;justify-content:space-between;gap:1rem;padding:.65rem 0;border-bottom:1px solid var(--nevoa);align-items:center}
.item-lista:last-child{border-bottom:0}
.item-lista .sub{color:var(--cinza);font-size:.87rem}
.mut{color:var(--cinza);font-size:.87rem}

/* etiquetas */
.tag{display:inline-block;font-size:.78rem;font-weight:600;padding:.12rem .55rem;border-radius:99px;white-space:nowrap}
.st-novo{background:#FADCE8;color:#8A2453}
.st-enviado,.st-andamento{background:#DCE8EF;color:#1F4A62}
.st-aprovado,.st-pago{background:#DCEBE2;color:#1F5039}
.st-recusado{background:#E6E3E0;color:#5E5A55}
.st-rascunho{background:#EFE9DB;color:#6A5222}
.st-pendente{background:#F6E6D2;color:#7A4A12}
.st-atrasado{background:#F5D9DD;color:#8A1E2F}
.srv{display:inline-flex;align-items:center;gap:.35rem;font-size:.8rem;color:var(--cinza)}
.srv::before{content:"";width:.6rem;height:.6rem;border-radius:2px;background:var(--c)}

/* filtros */
.filtros{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
.filtros button{border:1px solid var(--linha);background:transparent;border-radius:99px;padding:.3rem .8rem;cursor:pointer;font-size:.87rem}
.filtros button[aria-pressed=true]{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}

/* kanban */
.filtro-cli{display:inline-flex;align-items:center;gap:.4rem;margin-left:.4rem;font-size:.85rem;font-weight:600}
.filtro-cli select{font:inherit;font-weight:400;padding:.35rem .6rem;border:1px solid #CCCCCC;border-radius:99px;background:#FAFAFF;max-width:220px}
.cartao.novo{animation:cartaoNovo 1.4s ease}
@keyframes cartaoNovo{0%{box-shadow:0 0 0 3px #3A6EA5}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.cartao.novo{animation:none;outline:2px solid #3A6EA5}}
details summary{cursor:pointer;font-weight:600;font-size:.9rem;margin:.4rem 0}
.kanban{display:flex;gap:.9rem;overflow-x:auto;padding-bottom:1rem;align-items:flex-start;scroll-snap-type:x proximity}
.coluna{flex:0 0 272px;background:#E2E5DF;border-radius:10px;padding:.6rem;scroll-snap-align:start;max-height:calc(100vh - 180px);display:flex;flex-direction:column}
.coluna.sobre{background:#D4DCD9;box-shadow:inset 0 0 0 2px var(--mar)}
.col-cab{display:flex;justify-content:space-between;align-items:center;padding:.2rem .35rem .6rem;font-weight:700;font-size:1rem;margin:0;letter-spacing:0}
.col-cab span{font-weight:500;color:var(--cinza);font-size:.85rem}
.cartoes{display:flex;flex-direction:column;gap:.5rem;overflow-y:auto;min-height:40px}
.cartao{background:var(--branco);border-radius:7px;padding:.65rem .7rem;box-shadow:0 1px 0 rgba(22,32,43,.18);cursor:grab;border:0;text-align:left;width:100%;display:block}
.cartao:hover{box-shadow:0 1px 0 rgba(22,32,43,.18),0 0 0 2px var(--mar)}
.cartao.arrastando{opacity:.4}
.cartao .faixa{height:6px;width:40px;border-radius:3px;background:var(--c);margin-bottom:.45rem}
.cartao .tit{font-weight:600;line-height:1.25}
.cartao .cli{font-size:.84rem;color:var(--cinza)}
.cartao .meta{display:flex;justify-content:space-between;align-items:center;margin-top:.55rem;font-size:.8rem;color:var(--cinza);gap:.4rem}
.cartao .prazo.vence{color:var(--alerta);font-weight:600}
.cartao .prazo.ok{color:var(--mata)}
.avatar{width:1.6rem;height:1.6rem;border-radius:50%;display:inline-grid;place-items:center;font-size:.7rem;font-weight:700;color:#fff;background:var(--c,#2E5E7A);flex:none}
.add-cartao{margin-top:.5rem;background:none;border:0;text-align:left;padding:.45rem .4rem;border-radius:6px;cursor:pointer;color:var(--cinza)}
.add-cartao:hover{background:rgba(22,32,43,.07);color:var(--tinta)}
.nova-entrada textarea{width:100%;border:1px solid var(--linha);border-radius:6px;padding:.5rem;resize:none;margin-top:.5rem;background:#fff}

/* gaveta */
.fundo{position:fixed;inset:0;background:rgba(22,32,43,.35);z-index:50;display:none}
.fundo.on{display:block}
.gaveta{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--papel);z-index:51;transform:translateX(100%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s;display:flex;flex-direction:column}
.gaveta.on{transform:none;visibility:visible;transition:transform .22s ease}
@media (prefers-reduced-motion:reduce){.gaveta,.lateral{transition:none}}
.gav-cab{display:flex;justify-content:space-between;align-items:start;gap:1rem;padding:1.25rem 1.4rem;border-bottom:1px solid var(--linha)}
.gav-cab h2{font-size:1.4rem;margin:0;letter-spacing:-.02em}
.gav-acoes{display:flex;gap:.5rem;align-items:center;flex-wrap:nowrap;justify-content:flex-end;flex:none}
.gav-cab>div:first-child{min-width:0}
@media (max-width:520px){.gav-cab{flex-direction:column-reverse}.gav-acoes{align-self:flex-end}}
.gav-cab h2{word-break:break-word}
.gav-corpo{padding:1.25rem 1.4rem;overflow-y:auto;flex:1}
.gav-pe{padding:1rem 1.4rem calc(1rem + 52px);border-top:1px solid var(--linha);display:flex;gap:.5rem;flex-wrap:wrap;justify-content:flex-end}
.resp{margin-bottom:1rem}
.resp dt{font-size:.82rem;color:var(--cinza)}
.resp dd{white-space:pre-wrap}
.bloco{margin-bottom:1.5rem}
.bloco h3{font-size:.95rem;margin-bottom:.6rem;padding-bottom:.35rem;border-bottom:1px solid var(--linha)}

/* formulários */
.cmp{margin-bottom:.9rem}
.cmp label{display:block;font-size:.85rem;font-weight:600;margin-bottom:.3rem}
.cmp input,.cmp select,.cmp textarea{width:100%;padding:.55rem .7rem;border:1px solid #AEB5AD;border-radius:6px;background:#fff}
.cmp textarea{min-height:70px;resize:vertical}
.linha2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.checklist{list-style:none}
.checklist li{display:flex;gap:.5rem;align-items:center;padding:.3rem 0}
.checklist input{accent-color:var(--mata);width:1rem;height:1rem}
.checklist li.feito span{text-decoration:line-through;color:var(--cinza)}

/* orçamento */
.editor{display:grid;grid-template-columns:minmax(320px,5fr) 7fr;gap:1.5rem;align-items:start}
@media (max-width:1100px){.editor{grid-template-columns:1fr}}
.itens .it{display:grid;grid-template-columns:1fr 110px 32px;gap:.4rem;margin-bottom:.4rem;align-items:start}
.itens .it textarea{grid-column:1/3;min-height:44px;font-size:.88rem}
.itens input,.itens textarea{width:100%;padding:.5rem .65rem;border:1px solid #AEB5AD;border-radius:6px;background:#fff}
.itens input:disabled,.itens textarea:disabled,.cmp :disabled{background:#EEF0EC;color:#55606B}
.itens .rm{background:none;border:1px solid var(--linha);border-radius:6px;height:2.3rem;cursor:pointer}
.folha{background:#fff;aspect-ratio:210/297;width:100%;max-width:640px;margin-inline:auto;box-shadow:0 10px 30px -14px rgba(22,32,43,.45);padding:7% 8%;font-size:clamp(.62rem,1.05vw,.84rem);display:flex;flex-direction:column;position:sticky;top:1rem}
.folha .f-topo{display:flex;justify-content:space-between;align-items:start;border-bottom:2px solid var(--tinta);padding-bottom:1em}
.folha .f-logo{height:2.6em;width:auto}
.folha .f-nome{font-family:var(--titulo);font-size:2.6em;line-height:.9}
.folha .f-nome span{display:block;color:var(--mar);font-style:italic}
.folha .f-num{text-align:right;color:var(--cinza)}
.folha .f-num strong{display:block;color:var(--tinta);font-size:1.3em}
.folha .onda{height:.5em;margin:1.2em 0 1.4em;background:var(--ipe);border-radius:2px}
.folha .f-cli{font-weight:600;font-family:var(--titulo);font-weight:600;font-size:1.6em;letter-spacing:-.03em;margin-bottom:.2em}
.folha .f-para{color:var(--cinza);margin-bottom:1.4em}
.folha table{width:100%;border-collapse:collapse;margin-bottom:1em}
.folha th{text-align:left;font-size:.85em;color:var(--cinza);font-weight:500;border-bottom:1px solid var(--linha);padding:.4em 0}
.folha td{padding:.6em 0;border-bottom:1px solid var(--nevoa);vertical-align:top}
.folha td small{display:block;color:var(--cinza);font-size:.88em;white-space:pre-wrap}
.folha .v{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.folha .total{display:flex;justify-content:space-between;font-weight:800;font-size:1.4em;margin:.4em 0 1.2em;letter-spacing:-.01em}
.folha .cond{display:grid;grid-template-columns:1fr 1fr;gap:.8em 1.5em;margin-bottom:1em}
.folha .cond dt{font-size:.85em;color:var(--cinza)}
.folha .obs{white-space:pre-wrap;color:#2c3743}
.folha .f-pe{margin-top:auto;padding-top:1em;border-top:1px solid var(--linha);display:flex;justify-content:space-between;color:var(--cinza);font-size:.88em}

/* caixa */
.grafico{width:100%;height:auto;display:block}
.legenda{display:flex;gap:1rem;font-size:.84rem;color:var(--cinza);margin-bottom:.5rem}
.legenda span::before{content:"";display:inline-block;width:.7rem;height:.7rem;border-radius:2px;background:var(--c);margin-right:.35rem;vertical-align:-1px}
.mes-nav{display:flex;align-items:center;gap:.5rem}
.mes-nav button{border:1px solid var(--linha);background:transparent;border-radius:6px;width:2rem;height:2rem;cursor:pointer}
.mes-nav strong{min-width:9.5rem;text-align:center}

/* aviso */
.toast{position:fixed;left:50%;bottom:1.5rem;transform:translate(-50%,calc(100% + 3rem));visibility:hidden;background:var(--tinta);color:var(--papel);padding:.8rem 1.1rem;border-radius:8px;z-index:60;max-width:min(520px,92vw);transition:transform .25s;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.toast.on{transform:translate(-50%,0);visibility:visible}
.faixa-demo{background:#DCEAF2;color:#24476B;font-size:.85rem;padding:.45rem 1rem;text-align:center}
.oculto{display:none!important}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.pular{position:absolute;left:1rem;top:-4rem;z-index:100;background:var(--tinta);color:var(--papel);padding:.6rem 1rem;border-radius:8px;text-decoration:none}
.pular:focus{top:1rem}


.add-itens{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.add-itens select{padding:.45rem .7rem;border:1px solid var(--mar);border-radius:99px;background:#fff;color:var(--mar);font-weight:600;font-size:.87rem;cursor:pointer;max-width:100%}
/* relatórios */
.rel-l{display:grid;grid-template-columns:9rem 1fr auto;gap:.75rem;align-items:center;padding:.35rem 0;font-size:.92rem}
.rel-b{height:.7rem;background:var(--nevoa);border-radius:99px;overflow:hidden}
.rel-b i{display:block;height:100%;border-radius:99px}
.rel-l strong{font-variant-numeric:tabular-nums}
/* conteúdo do site e e-mails */
.secoes-cfg{display:grid;gap:1.25rem}
.linha-cfg{display:grid;grid-template-columns:1fr 1fr auto;gap:.5rem;align-items:end;margin-bottom:.5rem}
.linha-cfg.tres{grid-template-columns:1fr 2fr auto}
.linha-cfg .cmp{margin:0}
.rm-linha{border:1px solid var(--linha);background:transparent;border-radius:6px;height:2.4rem;padding:0 .7rem;cursor:pointer}
.depo-cfg{border:1px solid var(--nevoa);border-radius:8px;padding:.9rem;margin-bottom:.75rem;background:#fff}
.barra-salvar{position:sticky;bottom:calc(-1 * clamp(1.25rem,3vw,2.25rem));margin-bottom:calc(-1 * clamp(1.25rem,3vw,2.25rem));padding-bottom:calc(1rem + 52px + clamp(1.25rem,3vw,2.25rem))!important;background:var(--papel);padding:1rem 0;border-top:1px solid var(--linha);display:flex;gap:.5rem;justify-content:flex-end;margin-top:1.25rem;z-index:5}
.auto{display:grid;grid-template-columns:1fr auto auto;gap:1rem;align-items:center;padding:.9rem 0;border-bottom:1px solid var(--nevoa)}
.auto:last-child{border-bottom:0}
.email-prev{white-space:pre-wrap;background:#fff;border:1px solid var(--nevoa);border-radius:8px;padding:1rem;font-size:.92rem}
@media (max-width:700px){.linha-cfg,.linha-cfg.tres{grid-template-columns:1fr}.auto{grid-template-columns:1fr}.rel-l{grid-template-columns:1fr auto}.rel-b{grid-column:1/-1;grid-row:2}}
/* portfólio */
.pf-lista{list-style:none;display:grid;gap:.5rem}
.pf-item{display:grid;grid-template-columns:auto 56px 1fr auto auto;gap:.9rem;align-items:center;background:var(--sup);border:1px solid var(--nevoa);border-radius:10px;padding:.55rem .8rem}
.pf-item.oculto-site{border-style:dashed;background:transparent}
.pf-thumb{width:56px;height:56px;border-radius:8px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;overflow:hidden}
.pf-thumb img{width:100%;height:100%;object-fit:cover}
.pf-ordem{display:flex;flex-direction:column;gap:2px}
.pf-ordem button{border:1px solid var(--linha);background:transparent;border-radius:5px;width:1.9rem;height:1.5rem;cursor:pointer;line-height:1}
.pf-ordem button:disabled{opacity:.3;cursor:default}
.pf-nome{font-weight:600}
.chave{display:inline-flex;align-items:center;gap:.45rem;font-size:.87rem;cursor:pointer;white-space:nowrap}
.chave input{appearance:none;width:2.3rem;height:1.3rem;border-radius:99px;background:#C9C2B7;position:relative;cursor:pointer;transition:background .15s;margin:0}
.chave input::after{content:"";position:absolute;top:2px;left:2px;width:calc(1.3rem - 4px);height:calc(1.3rem - 4px);border-radius:50%;background:#fff;transition:transform .15s}
.chave input:checked{background:var(--mata)}
.chave input:checked::after{transform:translateX(1rem)}
.cores-pf{display:flex;gap:.5rem}
.cores-pf label{width:2rem;height:2rem;border-radius:50%;background:var(--c);cursor:pointer;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.cores-pf input{position:absolute;opacity:0;width:1px;height:1px}
.cores-pf input:checked+label{outline:3px solid var(--tinta);outline-offset:2px}
.cores-pf input:focus-visible+label{outline:3px solid var(--mar);outline-offset:2px}
.mini-gal{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem}
.mini-gal figure{position:relative;width:104px;border-radius:6px;overflow:hidden;background:#fff;border:1px solid var(--nevoa)}
.mini-gal img{width:100%;height:84px;object-fit:cover;display:block}
.mini-gal .rm{position:absolute;top:3px;right:3px;width:1.4rem;height:1.4rem;border-radius:50%;border:0;background:rgba(22,22,22,.75);color:#fff;cursor:pointer;line-height:1}
.gal-acoes{display:flex;gap:2px;padding:3px}
.gal-acoes button{flex:none;border:1px solid var(--linha);background:var(--sup);border-radius:4px;font-size:.72rem;padding:.15rem .3rem;cursor:pointer;line-height:1.2}
.gal-acoes{justify-content:space-between;align-items:center}
.gal-n{font-size:.72rem;color:var(--cinza)}
.linhas-ed{display:grid;gap:.6rem;margin:.6rem 0}
.linha-ed{border:1px solid var(--nevoa);border-radius:8px;background:#fff;padding:.6rem}
.linha-ed.linha-auto{border-style:dashed;background:transparent}
.linha-ed-cab{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:.5rem;font-size:.9rem}
.linha-ed-cab select{padding:.25rem .4rem;border:1px solid #AEB5AD;border-radius:6px;background:#fff;margin-left:.3rem}
.linha-ed .mini-gal{margin-top:0}
.gal-acoes button:disabled{opacity:.35;cursor:default}
.pf-prev{background:#fff;border:1px solid var(--nevoa);border-radius:8px;padding:.6rem;max-height:420px;overflow:auto}
.capa-prev{width:100%;aspect-ratio:16/9;border-radius:8px;background:var(--c);display:grid;place-items:center;color:#fff;font-weight:800;font-size:2.4rem;overflow:hidden;margin-bottom:.5rem}
.capa-prev img{width:100%;height:100%;object-fit:cover}
@media (max-width:700px){.pf-item{grid-template-columns:auto 48px 1fr;}.pf-item .chave,.pf-item .btn{grid-column:2/-1;justify-self:start}}
@media (max-width:700px){
  .tab-wrap{overflow:visible}
  .tabela,.tabela tbody,.tabela tr,.tabela td{display:block;width:100%}
  .tabela{background:transparent;border:0}
  .tabela thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
  .tabela tr{background:var(--sup);border:1px solid var(--nevoa);border-radius:8px;margin-bottom:.6rem;padding:.4rem .9rem}
  .tabela td{display:flex;justify-content:space-between;gap:1rem;align-items:center;border:0;padding:.35rem 0;text-align:right}
  .tabela td::before{content:attr(data-label);color:var(--cinza);font-size:.82rem;text-align:left}
  .tabela td:first-child{display:block;text-align:left;font-size:1.02rem;padding:.5rem 0 .35rem;border-bottom:1px solid var(--nevoa);margin-bottom:.2rem}
  .tabela td:first-child::before{display:none}
  .tabela td[colspan]::before{display:none}
  .tabela .valor{text-align:right}
  .numeros{grid-template-columns:1fr 1fr}
  .num:last-child:nth-child(odd){grid-column:1/-1}
  .num dd{font-size:1.3rem}
}

/* busca */
.busca{position:relative;padding:0 .2rem}
.busca input{width:100%;background:rgba(237,239,234,.1);border:1px solid rgba(237,239,234,.3);color:var(--papel);border-radius:8px;padding:.5rem .65rem;font-size:.9rem}
.busca input::placeholder{color:rgba(237,239,234,.65)}
.busca-res{position:absolute;left:.2rem;right:.2rem;top:calc(100% + .35rem);background:var(--sup);color:var(--tinta);border-radius:8px;box-shadow:0 14px 30px -10px rgba(0,0,0,.45);z-index:45;max-height:60vh;overflow-y:auto;padding:.35rem;width:max(100%,320px)}
.busca-res[hidden]{display:none}
.busca-res h3{font-size:.75rem;color:var(--cinza);font-weight:600;padding:.45rem .5rem .2rem}
.busca-res button{display:block;width:100%;text-align:left;background:none;border:0;padding:.45rem .5rem;border-radius:6px;cursor:pointer;font-size:.9rem}
.busca-res button:hover,.busca-res button:focus-visible{background:var(--papel)}
.busca-res button small{display:block;color:var(--cinza);font-size:.78rem}
/* etiquetas, comentários e anexos dos cartões */
.etqs{display:flex;gap:.25rem;flex-wrap:wrap;margin-bottom:.4rem}
.etq{font-size:.68rem;font-weight:700;padding:.08rem .45rem;border-radius:4px;background:var(--c);color:#fff;white-space:nowrap}
.etq-sel{display:flex;gap:.4rem;flex-wrap:wrap}
.etq-sel label{display:inline-flex;align-items:center;gap:.35rem;font-size:.85rem;border:1px solid var(--linha);border-radius:99px;padding:.25rem .65rem;cursor:pointer}
.etq-sel label::before{content:"";width:.6rem;height:.6rem;border-radius:2px;background:var(--c)}
.etq-sel input{position:absolute;opacity:0;width:1px;height:1px}
.etq-sel input:checked+span{font-weight:700}
.etq-sel label:has(input:checked){border-color:var(--tinta);background:#fff}
.etq-sel label:has(input:focus-visible){outline:3px solid var(--mar);outline-offset:2px}
.cartao .ico{display:inline-flex;align-items:center;gap:.2rem}
.cartao .ico svg{width:.85rem;height:.85rem;fill:none;stroke:currentColor;stroke-width:2}
.coments{list-style:none;display:grid;gap:.6rem;margin-bottom:.7rem}
.coments li{background:#fff;border:1px solid var(--nevoa);border-radius:8px;padding:.6rem .75rem;font-size:.92rem}
.coments li.cliente{border-color:var(--ipe);background:#F3F8FB}
.coments small{display:block;color:var(--cinza);font-size:.78rem;margin-bottom:.15rem}
.coments p{white-space:pre-wrap}
.entregas{display:grid;gap:.5rem;margin-bottom:.6rem}
.entrega{display:grid;grid-template-columns:56px 1fr auto;gap:.7rem;align-items:center;background:#fff;border:1px solid var(--nevoa);border-radius:8px;padding:.45rem .6rem}
.entrega img,.entrega .doc{width:56px;height:56px;border-radius:6px;object-fit:cover;background:var(--papel);display:grid;place-items:center;font-size:.7rem;font-weight:700;color:var(--cinza)}
.st-ajustes{background:#F6E6D2;color:#7A4A12}
.st-aguardando{background:#DCE8EF;color:#1F4A62}
.cartao.fantasma{position:fixed;z-index:70;pointer-events:none;transform:rotate(3deg);box-shadow:0 14px 30px -10px rgba(0,0,0,.45);width:250px}
/* calendário */
.cal-topo{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--nevoa);border:1px solid var(--nevoa);border-radius:8px;overflow:hidden}
.cal .dsem{background:var(--papel);font-size:.78rem;font-weight:600;color:var(--cinza);padding:.4rem .5rem}
.cal .dia{background:var(--sup);min-height:112px;padding:.35rem;display:flex;flex-direction:column;gap:.2rem;min-width:0}
.cal .dia.fora{background:#F5F2EC}
.cal .dia.fora .n{color:#6B6560;font-weight:500}
.cal .dia.hoje .n{background:var(--mar);color:#fff}
.cal .n{font-size:.78rem;font-weight:700;width:1.5rem;height:1.5rem;border-radius:50%;display:grid;place-items:center}
.ev{display:block;width:100%;text-align:left;font-size:.74rem;line-height:1.25;padding:.15rem .35rem;border-radius:4px;border:0;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 14%,#fff);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tinta)}
.ev:hover{background:color-mix(in srgb,var(--c) 26%,#fff)}
.cal-lista{display:none}
@media (max-width:860px){.cal{display:none}.cal-lista{display:block}.cal-lista .dia-l{background:var(--sup);border:1px solid var(--nevoa);border-radius:8px;padding:.6rem .8rem;margin-bottom:.5rem}.cal-lista h3{font-size:.9rem;margin-bottom:.35rem}.cal-lista .ev{white-space:normal;font-size:.85rem;padding:.35rem .5rem;margin-bottom:.25rem}}
.contrato-prev{background:#fff;border:1px solid var(--nevoa);border-radius:8px;padding:1rem 1.2rem;font-size:.86rem;max-height:55vh;overflow:auto}
.contrato-prev h2{font-size:.9rem;margin:1rem 0 .4rem}
.contrato-prev p{margin-bottom:.45rem}
.contrato-prev p.sub{padding-left:1rem}
.contrato-prev ul{margin:0 0 .5rem 1.2rem}
.canal{font-size:.7rem;font-weight:700;padding:.05rem .4rem;border-radius:4px;background:#DCEBE2;color:#1F5039;margin-left:.3rem}
@media print{
  body *{visibility:hidden}
  .folha,.folha *{visibility:visible}
  .folha{position:fixed;inset:0;box-shadow:none;max-width:none;width:100%;font-size:11pt;aspect-ratio:auto;height:100%}
  @page{size:A4;margin:0}
}

  @view-transition{navigation:auto}
  .marca{view-transition-name:marca}
  ::view-transition-old(root){animation:sai .35s cubic-bezier(.7,0,.3,1) both}
  ::view-transition-new(root){animation:entra .55s cubic-bezier(.2,.7,.2,1) .1s both}
  @keyframes sai{to{opacity:0;transform:translateY(-24px)}}
  @keyframes entra{from{opacity:0;transform:translateY(40px)}}
  @media (prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
#pf-gal .gal-item[data-arrasta]{cursor:grab;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#pf-gal .gal-item.arrastando{opacity:.3}
#pf-gal .gal-item.antes{box-shadow:-5px 0 0 #2F5F8A}#pf-gal .gal-item.depois{box-shadow:5px 0 0 #2F5F8A}
.fantasma{position:fixed;width:72px;height:72px;object-fit:cover;pointer-events:none;z-index:3000;border-radius:10px;opacity:.92;transform:rotate(4deg);box-shadow:0 8px 24px rgba(0,0,0,.25)}
#pf-gal .linha-ed-cab .pega{cursor:grab;touch-action:none;border:1px solid var(--linha,#D9D2C9);background:#fff;border-radius:8px;width:32px!important;min-width:32px;height:32px;padding:0;font-size:1rem;line-height:1;color:#5E5A55}
#pf-gal .linha-ed-cab .pega-seta{border:1px solid var(--linha,#D9D2C9);background:#fff;border-radius:8px;width:28px!important;min-width:28px;height:32px;padding:0;color:#5E5A55;cursor:pointer}
#pf-gal .pega-seta[disabled]{opacity:.35;cursor:default}
#pf-gal .linha-ed.l-arrastando{opacity:.4}
#pf-gal .linha-ed.l-antes{box-shadow:0 -4px 0 #2F5F8A}#pf-gal .linha-ed.l-depois{box-shadow:0 4px 0 #2F5F8A}
.fantasma-linha{position:fixed;pointer-events:none;z-index:3000;background:#2D2D2D;color:#fff;padding:.35rem .7rem;border-radius:99px;font-size:.85rem;box-shadow:0 6px 18px rgba(0,0,0,.25)}
</style>
