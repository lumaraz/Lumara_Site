<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumara Silva — Links</title>
<meta name="description" content="Links da Lumara Silva, designer de marca e visual.">
<meta property="og:image" content="https://lumarasilva.com.br/img/compartilhar.jpg">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="apple-touch-icon" href="img/favicon-180.png">
<link rel="preload" href="fonts/inter-tight-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fontes.css">
<style>
  :root{--bege:#F2EFE9;--claro:#FBFAF7;--azul:#86BBD8;--azul-esc:#3A6EA5;--texto:#2D2D2D;--linha:#DAD4CA;--suave:#6B6560}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bege);color:var(--texto);font-family:"Inter Tight",system-ui,sans-serif;min-height:100svh;display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
  :focus-visible{outline:3px solid var(--azul-esc);outline-offset:3px;border-radius:6px}
  main{width:min(460px,100% - 2.5rem);padding:3.5rem 0 3rem;text-align:center}
  .foto{width:96px;height:96px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 1.1rem}
  .logo{height:34px;width:auto;display:block;margin:0 auto .6rem}
  .sub{color:var(--suave);margin-bottom:2rem;line-height:1.45}
  ul{list-style:none;display:grid;gap:.7rem}
  a.bt{display:block;padding:1.05rem 1.2rem;border-radius:14px;border:1px solid var(--linha);background:var(--claro);text-decoration:none;color:inherit;font-weight:600;font-size:1.05rem;transition:transform .15s,border-color .15s}
  a.bt:hover{border-color:var(--texto);transform:translateY(-2px)}
  a.bt.destaque{background:var(--azul-esc);border-color:var(--azul-esc);color:#fff}
  .lang{position:absolute;top:1rem;right:1rem;display:inline-flex;padding:2px;border:1px solid var(--linha);border-radius:99px;background:var(--claro);cursor:pointer;font:inherit;font-size:.78rem;font-weight:600;color:var(--suave)}
  .lang span{padding:.22rem .55rem;border-radius:99px}
  .lang span.ativo{background:var(--texto);color:var(--bege)}
  footer{margin-top:2.5rem;font-size:.85rem;color:var(--suave)}
  footer a{color:inherit}
  @media (prefers-reduced-motion:reduce){a.bt{transition:none}a.bt:hover{transform:none}}
</style>
</head>
<body>
<button class="lang" id="idioma" aria-label="Switch to English" lang="en"><span class="ativo">PT</span><span>EN</span></button>
<main>
  <img class="foto" src="img/avatar.webp" alt="Lumara Silva" width="240" height="240">
  <h1><img class="logo" src="img/logo-escuro.svg" alt="Lumara Silva" width="1552" height="366"></h1>
  <p class="sub" id="sub">Designer de marca e visual no Rio de Janeiro.<br>Identidade visual e design para social media.</p>
  <ul id="links"></ul>
  <footer><a href="index.html">lumarasilva.com.br</a> · <a href="privacidade.html" id="priv">Privacidade</a></footer>
</main>
<script src="/api/publico"></script>
<script src="js/site.js"></script>
<script src="js/comum.js"></script>
<script>
const e=LS.esc, ext=u=>/^https?:/.test(u);
/* traduções padrão para os botões que vêm prontos; os novos usam o campo em inglês da área da equipe */
const PADRAO_EN={"Solicitar orçamento":"Request a quote","Ver portfólio":"See portfolio"};
function render(lang){
  const en=lang==="en";
  document.getElementById("sub").innerHTML=en?"Brand and visual designer in Rio de Janeiro.<br>Visual identity and social media design.":"Designer de marca e visual no Rio de Janeiro.<br>Identidade visual e design para social media.";
  document.getElementById("priv").textContent=en?"Privacy":"Privacidade";
  document.getElementById("links").innerHTML=SITE.carregar().links.filter(l=>l.titulo&&l.url).map(l=>{
    const t=en?(l.tituloEn||PADRAO_EN[l.titulo]||l.titulo):l.titulo;
    return `<li><a class="bt${l.destaque?" destaque":""}" href="${e(l.url)}"${ext(l.url)?' target="_blank" rel="noopener"':""}>${e(t)}${ext(l.url)?`<span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)"> ${en?"(opens in a new tab)":"(abre em nova aba)"}</span>`:""}</a></li>`}).join("");
}
render(LS.ligarIdioma(document.getElementById("idioma"),render));
</script>
<script src="js/volta.js"></script>
</body>
</html>
