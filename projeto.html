<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projeto — Lumara Silva</title>
<link rel="icon" type="image/svg+xml" href="img/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="apple-touch-icon" href="img/favicon-180.png">
<link rel="preload" href="fonts/inter-tight-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fontes.css">
<style>
  .btn-link{display:inline-flex;align-items:center;text-decoration:none;font-weight:600;font-size:.95rem;color:var(--texto,#2D2D2D);border:1px solid currentColor;border-radius:99px;padding:.5rem 1.1rem;white-space:nowrap}
  .btn-link:hover{background:#2D2D2D;color:#FAFAFF;border-color:#2D2D2D}

  :root{--bege:#F2EFE9;--claro:#FAFAFF;--azul:#86BBD8;--azul-esc:#3A6EA5;--texto:#2D2D2D;--marrom:#462D26;--linha:#CCCCCC;--suave:#2D2D2D}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bege);color:var(--texto);font-family:"Inter Tight",system-ui,sans-serif;font-size:1.0625rem;line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  :focus-visible{outline:3px solid var(--azul-esc);outline-offset:3px;border-radius:3px}
  .wrap{width:min(1180px,100% - 2.5rem);margin-inline:auto}
  header .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}
  .marca img{height:clamp(36px,4vw,46px);width:auto;display:block}
  .marca{view-transition-name:marca}
  header nav a{font-size:.95rem;text-underline-offset:4px}
  .topo-proj{padding:clamp(2.5rem,6vw,4.5rem) 0 2rem;display:grid;grid-template-columns:1fr auto;gap:1rem 2rem;align-items:end}
  .tag{display:inline-block;font-size:.85rem;padding:.25rem .75rem;border-radius:99px;border:1px solid var(--linha);background:var(--claro);margin-bottom:1rem}
  h1{font-size:clamp(2.6rem,7vw,5.6rem);font-weight:800;letter-spacing:-.05em;line-height:.95}
  .desc{font-size:clamp(1.1rem,1.8vw,1.35rem);color:var(--suave);margin-top:.75rem}
  .meta{color:var(--suave);font-size:.95rem;text-align:right}
  .capa{border-radius:16px;overflow:hidden;aspect-ratio:16/9;display:grid;place-items:center;background:var(--c);color:#FAFAFF;font-weight:800;font-size:clamp(4rem,12vw,9rem);letter-spacing:-.06em}
  .capa.com-img{aspect-ratio:auto;background:none}
  .capa img{width:100%;height:auto;max-height:80vh;object-fit:cover;display:block}
  .texto{display:grid;grid-template-columns:minmax(200px,4fr) 8fr;gap:clamp(1.5rem,5vw,4rem);padding:clamp(2.5rem,6vw,4rem) 0}
  .ficha{display:grid;gap:1rem;align-content:start;font-size:.95rem}
  .ficha dt{color:var(--suave);font-size:.85rem}
  .ficha dd{font-weight:600}
  .ficha .sob{display:block;font-weight:400;color:var(--suave);margin-top:.1rem}
  .voltar{display:inline-flex;align-items:center;gap:.45rem;text-decoration:none;font-weight:600;font-size:.95rem;padding:.45rem 1rem .45rem .8rem;border:1px solid var(--texto);border-radius:99px;margin-bottom:1.25rem}
  .voltar svg{width:1.05rem;height:1.05rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
  .voltar:hover{background:var(--texto);color:#FAFAFF}
  .voltar:hover svg{transform:translateX(-3px)}
  .corpo p{max-width:62ch;font-size:clamp(1.05rem,1.4vw,1.2rem);line-height:1.65}
  .corpo p+p{margin-top:1.1rem}
  .extras{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.75rem}
  .lang{display:inline-flex;padding:2px;border:1px solid var(--linha);border-radius:99px;background:var(--claro);cursor:pointer;font:inherit;font-size:.78rem;font-weight:600;color:var(--suave)}
  .lang span{padding:.22rem .55rem;border-radius:99px}
  .lang span.ativo{background:var(--texto);color:#FAFAFF}
  header nav{display:flex;gap:.6rem;align-items:center}
  .acoes{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between;border-top:1px solid var(--texto);margin-top:clamp(2.5rem,6vw,4rem);padding:2rem 0 4rem}
  .botao{display:inline-block;background:var(--azul-esc);color:#FAFAFF;text-decoration:none;padding:1rem 1.8rem;border-radius:99px;font-weight:600;font-size:1.05rem}
  .botao:hover{background:#2D2D2D}
  .prox{text-decoration:none;text-align:right}
  .prox small{display:block;color:var(--suave)}
  .prox strong{font-size:1.4rem;font-weight:700;letter-spacing:-.03em}
  .vazio{padding:5rem 0}
  @view-transition{navigation:auto}
  @media (max-width:760px){.topo-proj,.texto{grid-template-columns:1fr}.ficha{grid-template-columns:1fr 1fr}.meta{text-align:left}.prox{text-align:left}}
</style>
<style>/* espaço para o selo do Netlify no canto */body{padding-bottom:56px}@media print{body{padding-bottom:0}}</style>
</head>
<body>
<header><div class="wrap">
  <a class="marca" href="index.html"><img src="img/logo-escuro.svg" alt="Lumara Silva" width="1552" height="366"></a>
  <nav aria-label="Projeto"><button class="lang" id="idioma" aria-label="Switch to English" lang="en"><span class="ativo">PT</span><span>EN</span></button></nav>
</div></header>
<main id="conteudo" class="wrap"></main>

<script src="/api/publico"></script>
<script src="js/portfolio.js"></script>
<script>document.head.insertAdjacentHTML("beforeend",`<style>${PORTFOLIO.CSS_GALERIA}</style>`)</script>
<script>
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sigla=n=>n.split(/\s+/).filter(w=>/^[A-ZÀ-Ú]/.test(w)).slice(0,2).map(w=>w[0]).join("");
let lang="pt"; try{if(localStorage.getItem("lumara_lang")==="en")lang="en"}catch(e){}
const L={
  pt:{todos:"Todos os projetos",ano:"Ano",area:"Área",cliente:"Cliente",orc:"Solicitar orçamento",prox:"Próximo projeto",img:"imagem",de:"de",capa:"Capa do projeto",nf:"Projeto não encontrado",nfp:"Ele pode ter sido despublicado.",nfl:"Veja todos os trabalhos",abre:"(abre em nova aba)"},
  en:{todos:"All projects",ano:"Year",area:"Field",cliente:"Client",orc:"Request a quote",prox:"Next project",img:"image",de:"of",capa:"Project cover",nf:"Project not found",nfp:"It may have been unpublished.",nfl:"See all work",abre:"(opens in a new tab)"}
};
function mostrar(rolar){
  const T=L[lang], en=lang==="en";
  document.documentElement.lang=en?"en":"pt-BR";
  const b=document.getElementById("idioma"); b.children[0].classList.toggle("ativo",!en); b.children[1].classList.toggle("ativo",en);
  b.setAttribute("aria-label",en?"Mudar para português":"Switch to English"); b.setAttribute("lang",en?"pt-BR":"en");
  const lista=PORTFOLIO.carregar().filter(p=>p.publicado), slug=location.hash.slice(1);
  const i=lista.findIndex(p=>p.slug===slug), p=lista[i], m=document.getElementById("conteudo");
  if(!p){m.innerHTML=`<div class="vazio"><h1>${T.nf}</h1><p class="desc">${T.nfp} <a href="index.html#trabalhos">${T.nfl}</a>.</p></div>`;document.title=T.nf+" — Lumara Silva";return}
  const prox=lista[(i+1)%lista.length], area=PORTFOLIO.AREAS[p.area]?.[lang]||"", desc=(en&&p.descricaoEn)||p.descricao;
  document.title=`${p.nome} — Lumara Silva`;
  /* prévia de compartilhamento: no site publicado, cada projeto ganha a própria página com estas tags no HTML */
  const meta=(k,v)=>{let el=document.querySelector(`meta[property="${k}"]`);if(!el){el=document.createElement("meta");el.setAttribute("property",k);document.head.appendChild(el)}el.content=v};
  if(p.compartilhar) meta("og:image",new URL(p.compartilhar,location.href).href); meta("og:title",document.title);
  const par=PORTFOLIO.paragrafos(p,en), links=(p.links||[]).filter(l=>l.url);
  /* ficha ao lado do texto: cliente com a descrição, área e ano */
  const ficha=`<dl class="ficha"><div><dt>${T.cliente}</dt><dd>${esc(p.nome)}${desc?`<span class="sob">${esc(desc)}</span>`:""}</dd></div><div><dt>${T.area}</dt><dd>${esc(area)}</dd></div>${p.ano?`<div><dt>${T.ano}</dt><dd>${esc(p.ano)}</dd></div>`:""}</dl>`;
  m.innerHTML=`
  <div class="topo-proj"><div><a class="voltar" href="index.html#trabalhos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>${T.todos}</a><h1>${esc(p.nome)}</h1></div></div>
  <div class="capa${p.capa?" com-img":""}" style="--c:${esc(p.cor)};${p.cor==="#86BBD8"?"color:#2D2D2D":""}">${p.capa?`<img src="${esc(p.capa)}" alt="${T.capa} ${esc(p.nome)}">`:esc(sigla(p.nome))}</div>
  ${`<div class="texto">
     ${ficha}
     <div class="corpo">${par.map(t=>`<p>${esc(t)}</p>`).join("")}
       ${links.length?`<p class="extras">${links.map(l=>`<a class="btn-link" href="${esc(l.url)}" target="_blank" rel="noopener">${esc((en&&l.tEn)||l.t)}<span class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)"> ${T.abre}</span></a>`).join("")}</p>`:""}</div>
   </div>`}
  ${p.galeria&&p.galeria.length?PORTFOLIO.galeriaHTML(p,esc,(k,n)=>`${esc(p.nome)}, ${T.img} ${k+1} ${T.de} ${n}`):""}
  <div class="acoes">
    <div><a class="botao" href="orcamento.html">${T.orc}</a></div>
    ${lista.length>1?`<a class="prox" href="#${prox.slug}"><small>${T.prox}</small><strong>${esc(prox.nome)}</strong></a>`:""}
  </div>`;
  if(rolar!==false) scrollTo(0,0);
}
document.getElementById("idioma").addEventListener("click",()=>{lang=lang==="pt"?"en":"pt";try{localStorage.setItem("lumara_lang",lang)}catch(e){}mostrar(false)});
addEventListener("hashchange",mostrar); mostrar();
</script>
<script src="js/volta.js"></script>
<script src="js/visita.js" defer></script>
</body>
</html>
